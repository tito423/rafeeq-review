<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مراجعة محتوى رفيق الدرب</title>
<meta name="theme-color" content="#0b1624">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0b1624; --card:#12233a; --ink:#eae6de; --muted:#9fb0c0; --gold:#d4af37; --line:#24384e; --ok:#3fb68b; }
@media (prefers-color-scheme: light) { :root { --bg:#f7f3ea; --card:#fff; --ink:#1d2c26; --muted:#5b6b66; --gold:#8a6d20; --line:#e2d9c5; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Cairo, system-ui, sans-serif; line-height:1.9; }
header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 14px 8px; }
h1 { margin:0; font-size:1.15rem; color:var(--gold); }
.sub { margin:0; font-size:.8rem; color:var(--muted); }
nav { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
nav button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:18px; padding:4px 12px; font:inherit; font-size:.88rem; }
nav button.on { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
.tools { display:flex; gap:6px; margin-top:6px; }
.tools input { flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:6px 10px; font:inherit; }
.tools button { border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:12px; padding:0 10px; font:inherit; font-size:.85rem; }
main { padding:10px 12px 60px; max-width:820px; margin:0 auto; }
.intro { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; font-size:.9rem; color:var(--muted); }
details { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; }
summary { cursor:pointer; padding:10px 14px; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:8px; }
summary .n { color:var(--muted); font-weight:400; font-size:.8rem; }
.item { border-top:1px solid var(--line); padding:10px 14px; }
.item.done { opacity:.55; }
.text { font-family:Amiri, serif; font-size:1.15rem; line-height:2.1; white-space:pre-wrap; }
.text.aya { color:var(--gold); }
.note { font-size:.85rem; color:var(--muted); margin-top:6px; white-space:pre-wrap; border-inline-start:3px solid var(--gold); padding-inline-start:8px; }
.meta { font-size:.75rem; color:var(--muted); direction:ltr; text-align:right; }
.rev { display:flex; gap:8px; align-items:center; margin-top:8px; }
.rev label { font-size:.82rem; color:var(--muted); display:flex; gap:4px; align-items:center; }
.rev textarea { flex:1; min-height:34px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; padding:4px 8px; font:inherit; font-size:.85rem; }
.rev textarea.has { border-color:var(--gold); }
mark { background:var(--gold); color:#111; }
.stat { font-size:.8rem; color:var(--muted); margin:8px 2px; }
</style>
</head>
<body>
<header>
  <h1>مراجعة محتوى رفيق الدرب</h1>
  <p class="sub">كل نص ديني في التطبيق كما يراه المستخدم، مع مصدره وتخريجه</p>
  <nav id="tabs"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="ابحث (بلا حاجة إلى التشكيل)…">
    <button id="export">نسخ ملاحظاتي</button>
  </div>
</header>
<main id="main"></main>
<script>
const TABS = [
  ['intro', 'عن المراجعة'],
  ['azkar', 'الأذكار'],
  ['quotes', 'المقولات'],
  ['texts', 'نصوص التطبيق'],
  ['hajj', 'الحج والعمرة'],
  ['tajweed', 'التجويد'],
  ['sources', 'المصادر'],
];
const cache = {};
const store = (() => { try { return JSON.parse(localStorage.getItem('review') || '{}'); } catch { return {}; } })();
const save = () => { try { localStorage.setItem('review', JSON.stringify(store)); } catch {} };
const norm = s => (s || '').replace(/[ً-ْٰـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let tab = location.hash.slice(1) || 'intro';

async function load(name) {
  if (!cache[name]) cache[name] = await (await fetch('data/' + name + '.json')).json();
  return cache[name];
}

// Every tab becomes [{title, items:[{id, text, note, kind, meta}]}].
async function groups(t) {
  if (t === 'azkar') return (await load('azkar')).map(s => ({ title: s.title,
    items: s.items.map(i => ({ id: 'azkar.' + i.id, text: i.text, note: i.note })) }));
  if (t === 'quotes') return (await load('quotes')).books.map(b => ({ title: b.titleAr + ' — ' + b.authorAr,
    items: b.quotes.map((q, n) => ({ id: 'quote.' + b.id + '.' + n, text: q.t.ar, note: b.sourceLabel, meta: 'ص ' + q.p })) }));
  if (t === 'texts') return (await load('texts')).map(g => ({ title: g.title,
    items: g.items.map(i => ({ id: 'text.' + i.id, text: i.text, meta: i.id })) }));
  if (t === 'sources') return [{ title: 'مصادر المحتوى كما يذكرها التطبيق', items: (await load('sources')).map(i => ({ id: 'src.' + i.id, text: i.text })) }];
  if (t === 'hajj') { const d = await load('hajj'); return Object.entries(d).flatMap(([track, steps]) =>
    steps.map(s => ({ title: (track === 'hajj' ? 'الحج' : 'العمرة') + ' — ' + s.key + ' (ص ' + s.pages + ')',
      items: s.paras.map((p, n) => ({ id: 'hajj.' + track + '.' + s.key + '.' + n, text: p.text, kind: p.kind })) }))); }
  if (t === 'tajweed') { const d = await load('tajweed'); const names = { tuhfa: 'تحفة الأطفال', jazariyyah: 'المقدمة الجزرية', tamhid: 'التمهيد' };
    return Object.entries(d).flatMap(([book, ls]) => ls.map((l, k) => ({ title: names[book] + ' — ' + l.title,
      items: l.paras.map((p, n) => ({ id: 'tajweed.' + book + '.' + k + '.' + n, text: p.text, kind: p.kind })) }))); }
  return [];
}

function intro() {
  return `<div class="intro">
  <p><b>الغرض:</b> مراجعة كل نص ديني يعرضه تطبيق «رفيق الدرب»: الأذكار وتخريجها، والمقولات ومصادرها، ونصوص الواجهة (سنن السور، حديث اليوم، الصيام، الرقية، دليل المسلم الجديد، تراجم الأئمة…)، ومقاطع «الإيضاح» في المناسك، ودروس التجويد.</p>
  <p><b>النصوص منقولة آليًا</b> مما يحمله التطبيق نفسه، دون إعادة كتابة: قواعد البيانات المضمَّنة، والكتب مقطوعة بنفس كود التطبيق.</p>
  <p><b>طريقة المراجعة:</b> علّم «تمت» على ما راجعته، واكتب ملاحظتك تحت أي نص. تُحفظ على جهازك، وزر «نسخ ملاحظاتي» يجمعها في نص واحد ترسله.</p>
  <p><b>قريبًا:</b> الكتب التسعة بأحكامها ومحققيها، ثم كتب المكتبة كاملة.</p></div>`;
}

function hl(text, q) {
  const t = esc(text); if (!q) return t;
  const n = norm(q); if (!n) return t;
  return norm(t).includes(n) ? t : t; // highlighting on diacritised text is unreliable; filter only
}

async function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const main = document.getElementById('main');
  if (tab === 'intro') { main.innerHTML = intro(); return; }
  main.innerHTML = '<p class="stat">…جارٍ التحميل</p>';
  const q = norm(document.getElementById('q').value.trim());
  const gs = await groups(tab);
  let shown = 0, done = 0, total = 0;
  const html = gs.map(g => {
    const items = g.items.filter(i => !q || norm(i.text + ' ' + (i.note || '')).includes(q));
    total += g.items.length; done += g.items.filter(i => store[i.id]?.ok).length;
    if (!items.length) return '';
    shown += items.length;
    return `<details${q ? ' open' : ''}><summary>${esc(g.title)}<span class="n">${items.length}</span></summary>` +
      items.map(i => { const r = store[i.id] || {};
        return `<div class="item${r.ok ? ' done' : ''}" data-id="${esc(i.id)}">
        <div class="text${i.kind === 'aya' ? ' aya' : ''}">${esc(i.text)}</div>
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
        ${i.meta ? `<div class="meta">${esc(i.meta)}</div>` : ''}
        <div class="rev"><label><input type="checkbox"${r.ok ? ' checked' : ''}> تمت</label>
        <textarea placeholder="ملاحظة…" class="${r.c ? 'has' : ''}">${esc(r.c || '')}</textarea></div></div>`; }).join('') + '</details>';
  }).join('');
  main.innerHTML = `<p class="stat">راجعت ${done} من ${total}${q ? ' · النتائج: ' + shown : ''}</p>` + html;
}

document.getElementById('main').addEventListener('change', e => {
  const it = e.target.closest('.item'); if (!it) return;
  const id = it.dataset.id; store[id] = store[id] || {};
  if (e.target.type === 'checkbox') { store[id].ok = e.target.checked; it.classList.toggle('done', e.target.checked); }
  else { store[id].c = e.target.value.trim(); e.target.classList.toggle('has', !!store[id].c); }
  save();
});
document.getElementById('export').onclick = async () => {
  const lines = [];
  for (const [t, name] of TABS.slice(1)) for (const g of await groups(t)) for (const i of g.items) {
    const r = store[i.id]; if (r && r.c) lines.push(`[${name} — ${g.title}]\n${i.text.slice(0, 160)}\n← ${r.c}\n`);
  }
  const text = lines.length ? 'ملاحظات مراجعة رفيق الدرب\n\n' + lines.join('\n') : 'لا توجد ملاحظات بعد.';
  try { await navigator.clipboard.writeText(text); alert('نُسخت ' + lines.length + ' ملاحظة. الصقها في رسالة.'); }
  catch { prompt('انسخ النص:', text); }
};
let timer; document.getElementById('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 250); });
document.getElementById('tabs').innerHTML = TABS.map(([t, n]) => `<button data-t="${t}">${n}</button>`).join('');
document.getElementById('tabs').onclick = e => { const t = e.target.dataset.t; if (!t) return; tab = t; location.hash = t; render(); };
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
